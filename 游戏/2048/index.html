<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <button id="backBtn" class="back" type="button">← 返回</button>

  <header class="head" id="head">
    <div class="chip"><span class="label">分数</span><span id="score" class="num">0</span></div>
    <button id="restart" type="button" aria-label="新的一局">↻</button>
    <div class="chip"><span class="label">最佳</span><span id="best" class="num">0</span></div>
  </header>

  <div class="board-wrap" id="boardWrap">
    <div id="board"></div>
  </div>

  <footer class="foot" id="foot">
    <span class="hint">滑动合并相同数字，凑出 2048</span>
  </footer>
</div>

<div id="scrim" class="scrim"></div>

<div id="result" class="result" role="dialog" aria-modal="true">
  <div class="sheet">
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <div class="stats">
      <div><span>本局分数</span><strong id="resultScore">0</strong></div>
      <div><span>最大方块</span><strong id="resultMax">0</strong></div>
      <div><span>历史最佳</span><strong id="resultBest">0</strong></div>
    </div>
    <div class="actions">
      <button id="againBtn" type="button">再来一局</button>
      <button id="continueBtn" type="button">继续玩</button>
      <button id="closeBtn" type="button">看看棋盘</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
